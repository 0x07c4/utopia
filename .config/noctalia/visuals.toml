# Declarative visual baseline for Noctalia v5.
# An empty directory follows the host's XDG Pictures directory.

[shell]
font_family = "Maple Mono NF CN"
lang = "zh-Hans"

[theme]
mode = "dark"
source = "wallpaper"
builtin = "Tokyo-Night"
wallpaper_scheme = "m3-content"

# Utopia-owned adapters use explicit Material roles instead of inheriting the
# terminal palette's historical color names. The Starship post-hook reuses
# Noctalia's mutation-safe marked-block applicator.
[theme.templates]
enable_builtin_templates = false
builtin_ids = []
enable_community_templates = false
community_ids = []

[theme.templates.user.utopia-kitty]
input_path = "templates/utopia/kitty.conf"
output_path = "$XDG_CONFIG_HOME/kitty/themes/noctalia.conf"
post_hook = "sh -c 'pkill -USR1 -x kitty >/dev/null 2>&1 || true'"

[theme.templates.user.utopia-niri]
input_path = "templates/utopia/niri.kdl"
output_path = "$XDG_CONFIG_HOME/niri/noctalia.kdl"

[theme.templates.user.utopia-starship]
input_path = "templates/utopia/starship-palette.toml"
output_path = "$XDG_CACHE_HOME/noctalia/starship-palette.toml"
post_hook = "bash /usr/share/noctalia/assets/templates/starship/apply.sh"

[wallpaper]
directory = ""

    [wallpaper.default]
    path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[bar.default]
font_family = "Maple Mono NF CN"
margin_ends = 0
