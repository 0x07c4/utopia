# Explicit bar layout; widget defaults remain owned by Noctalia.

[bar]
order = ["default"]

[bar.default]
enabled = true
position = "top"
start = ["launcher", "wallpaper", "workspaces"]
center = ["clock"]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]

# The only wallpaper entry opens Utopia's unified local and online browser.
[widget.wallpaper]
type = "utopia/wallpaper:wallpaper"
