# Utopia's managed wallpaper center combines local files and Wallhaven discovery
# in one keyboard-first panel. Runtime thumbnails and wallpapers stay outside Git.
[plugins]
enabled = ["utopia/wallpaper"]

# The same home-relative directory backs both pages of the unified browser.
[plugin_settings."utopia/wallpaper"]
wallpaper_dir = "~/Pictures/Wallpapers"
