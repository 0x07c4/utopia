schema_version = 1

[features."fcitx-wallpaper-theme"]
description = "Host-scoped wallpaper-driven Fcitx5 Classic UI theme."
state_path = "features.fcitx_wallpaper_theme"
domain = "input"
activation_state = "experimental"
required_artifacts = [
  "desktop.noctalia",
  "input.fcitx5",
  "input.fcitx5-theme-catppuccin-mocha-green",
]
template_source = ".config/noctalia/templates/utopia/fcitx5/theme.conf"
hook_source = ".config/noctalia/templates/utopia/fcitx5/apply.sh"
generated_directory = ".local/share/fcitx5/themes/utopia-wallpaper"
generated_theme = ".local/share/fcitx5/themes/utopia-wallpaper/theme.conf"
selector_destination = ".config/fcitx5/conf/classicui.conf"
fallback_theme = "catppuccin-mocha-green"
dynamic_theme = "utopia-wallpaper"
backup_destinations = [
  ".config/fcitx5/conf/classicui.conf",
  ".local/share/fcitx5/themes/utopia-wallpaper",
]
rollback_destinations = [
  ".config/fcitx5/conf/classicui.conf",
  ".local/share/fcitx5/themes/utopia-wallpaper",
]

[features."fcitx-wallpaper-theme".reload]
bus_name = "org.fcitx.Fcitx5"
object_path = "/controller"
interface = "org.fcitx.Fcitx.Controller1"
method = "ReloadAddonConfig"
argument = "classicui"
