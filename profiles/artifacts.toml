schema_version = 1

# This catalog maps reviewed repository content to paths relative to $HOME.
# It is planning data: resolving it never reads or writes the live home.

[[artifacts]]
id = "shell.zshrc"
layer = "workstation.utopia"
domain = "shell"
source = "shell/zsh/zshrc"
destination = ".zshrc"
kind = "file"
state = "managed"
capture = true
deploy = true
validators = ["zsh-syntax"]

[[artifacts]]
id = "shell.zimrc"
layer = "workstation.utopia"
domain = "shell"
source = "shell/zsh/zimrc"
destination = ".zimrc"
kind = "file"
state = "managed"
capture = true
deploy = true
validators = ["zsh-syntax"]

[[artifacts]]
id = "shell.starship"
layer = "workstation.utopia"
domain = "shell"
source = "shell/starship/starship.toml"
destination = ".config/starship.toml"
kind = "file"
state = "managed"
capture = true
deploy = true
validators = []

[[artifacts]]
id = "development.ssh-client"
layer = "workstation.utopia"
domain = "development"
source = "development/ssh/config"
destination = ".ssh/config"
kind = "file"
state = "managed"
capture = true
deploy = true
validators = ["ssh-config"]
mode = "0600"

[[artifacts]]
id = "editor.nvim"
layer = "workstation.utopia"
domain = "editor"
source = "editor/nvim"
destination = ".config/nvim"
kind = "gitlink"
state = "managed"
capture = true
deploy = true
validators = ["nvim-headless"]

[[artifacts]]
id = "desktop.niri"
layer = "workstation.utopia"
domain = "desktop"
source = "desktop/niri"
destination = ".config/niri"
kind = "tree"
state = "managed"
capture = true
deploy = true
validators = ["niri-config"]
excludes = ["cfg/display.kdl"]

[[artifacts]]
id = "desktop.niri-display-arch-laptop"
layer = "host.arch-laptop"
