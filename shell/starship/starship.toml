"$schema" = "https://starship.rs/config-schema.json"
palette = "noctalia"

# Powerline structure adapted from Starship's gruvbox-rainbow preset at
# v1.26.0. Utopia preserves the established module order while Noctalia owns
# only the marked palette block at the end of this file.
format = """
[](blue)\
$os\
$username\
[](bg:yellow fg:blue)\
$directory\
[](fg:yellow bg:green)\
$git_branch\
$git_status\
[](fg:green bg:sapphire)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:sapphire bg:surface2)\
$docker_context\
$conda\
$pixi\
$time\
[ ](fg:surface2)\
$line_break$character"""

[os]
disabled = false
style = "bg:blue fg:base"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰌽"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CachyOS = "󰣇"
EndeavourOS = ""
CentOS = "󱄛"
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:blue fg:base"
style_root = "bg:blue fg:base"
format = "[ $user ]($style)"

[directory]
style = "fg:base bg:yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙 "
Downloads = " "
Music = "󰝚 "
Pictures = " "
Developer = "󰲋 "

[git_branch]
symbol = ""
style = "bg:green"
format = "[[ $symbol $branch ](fg:base bg:green)]($style)"

[git_status]
style = "bg:green"
format = "[[($all_status$ahead_behind )](fg:base bg:green)]($style)"

[nodejs]
symbol = ""
style = "bg:sapphire"
format = "[[ $symbol( $version) ](fg:base bg:sapphire)]($style)"

[c]
symbol = " "
style = "bg:sapphire"
format = "[[ $symbol( $version) ](fg:base bg:sapphire)]($style)"

[cpp]
symbol = " "
style = "bg:sapphire"
format = "[[ $symbol( $version) ](fg:base bg:sapphire)]($style)"

[rust]
symbol = ""
style = "bg:sapphire"
format = "[[ $symbol( $version) ](fg:base bg:sapphire)]($style)"

[golang]
symbol = ""
style = "bg:sapphire"
format = "[[ $symbol( $version) ](fg:base bg:sapphire)]($style)"

[php]
symbol = ""
style = "bg:sapphire"
format = "[[ $symbol( $version) ](fg:base bg:sapphire)]($style)"

[java]
symbol = ""
style = "bg:sapphire"
format = "[[ $symbol( $version) ](fg:base bg:sapphire)]($style)"

[kotlin]
symbol = ""
style = "bg:sapphire"
format = "[[ $symbol( $version) ](fg:base bg:sapphire)]($style)"

[haskell]
symbol = ""
style = "bg:sapphire"
format = "[[ $symbol( $version) ](fg:base bg:sapphire)]($style)"

[python]
symbol = ""
style = "bg:sapphire"
format = "[[ $symbol( $version) ](fg:base bg:sapphire)]($style)"

[docker_context]
symbol = ""
style = "bg:surface2"
format = "[[ $symbol( $context) ](fg:text bg:surface2)]($style)"

[conda]
style = "bg:surface2"
format = "[[ $symbol( $environment) ](fg:text bg:surface2)]($style)"

[pixi]
style = "bg:surface2"
format = "[[ $symbol( $version)( $environment) ](fg:text bg:surface2)]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:surface2"
format = "[[  $time ](fg:text bg:surface2)]($style)"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[](bold fg:green)"
error_symbol = "[](bold fg:red)"
vimcmd_symbol = "[](bold fg:green)"
vimcmd_replace_one_symbol = "[](bold fg:mauve)"
vimcmd_replace_symbol = "[](bold fg:mauve)"
vimcmd_visual_symbol = "[](bold fg:yellow)"

# >>> NOCTALIA STARSHIP PALETTE >>>
# Deterministic Catppuccin Frappe fallback. Noctalia owns this marked block.
[palettes.noctalia]
base = "#303446"
surface0 = "#414559"
surface2 = "#626880"
text = "#c6d0f5"
blue = "#8caaee"
cyan = "#81c8be"
sapphire = "#85c1dc"
green = "#a6d189"
yellow = "#e5c890"
red = "#e78284"
mauve = "#ca9ee6"
# <<< NOCTALIA STARSHIP PALETTE <<<
