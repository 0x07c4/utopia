"$schema" = "https://starship.rs/config-schema.json"
palette = "noctalia"

# Powerline structure adapted from Starship's gruvbox-rainbow preset at
# v1.26.0. Utopia preserves the established module order and assigns explicit
# Material roles while Noctalia owns only the marked palette block below.
format = """
[](primary)\
$os\
$username\
[](bg:secondary fg:primary)\
$directory\
[](fg:secondary bg:accent)\
$git_branch\
$git_status\
[](fg:accent bg:tertiary)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:tertiary bg:surface2)\
$docker_context\
$conda\
$pixi\
$time\
[ ](fg:surface2)\
$line_break$character"""

[os]
disabled = false
style = "bg:primary fg:on_primary"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰌽"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CachyOS = "󰣇"
EndeavourOS = ""
CentOS = "󱄛"
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:primary fg:on_primary"
style_root = "bg:primary fg:on_primary"
format = "[ $user ]($style)"

[directory]
style = "fg:on_secondary bg:secondary"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙 "
Downloads = " "
Music = "󰝚 "
Pictures = " "
Developer = "󰲋 "

[git_branch]
symbol = ""
style = "bg:accent"
format = "[[ $symbol $branch ](fg:on_accent bg:accent)]($style)"

[git_status]
style = "bg:accent"
format = "[[($all_status$ahead_behind )](fg:on_accent bg:accent)]($style)"

[nodejs]
symbol = ""
style = "bg:tertiary"
format = "[[ $symbol( $version) ](fg:on_tertiary bg:tertiary)]($style)"

[c]
symbol = " "
style = "bg:tertiary"
format = "[[ $symbol( $version) ](fg:on_tertiary bg:tertiary)]($style)"

[cpp]
symbol = " "
style = "bg:tertiary"
format = "[[ $symbol( $version) ](fg:on_tertiary bg:tertiary)]($style)"

[rust]
symbol = ""
style = "bg:tertiary"
format = "[[ $symbol( $version) ](fg:on_tertiary bg:tertiary)]($style)"

[golang]
symbol = ""
style = "bg:tertiary"
format = "[[ $symbol( $version) ](fg:on_tertiary bg:tertiary)]($style)"

[php]
symbol = ""
style = "bg:tertiary"
format = "[[ $symbol( $version) ](fg:on_tertiary bg:tertiary)]($style)"

[java]
symbol = ""
style = "bg:tertiary"
format = "[[ $symbol( $version) ](fg:on_tertiary bg:tertiary)]($style)"

[kotlin]
symbol = ""
style = "bg:tertiary"
format = "[[ $symbol( $version) ](fg:on_tertiary bg:tertiary)]($style)"

[haskell]
symbol = ""
style = "bg:tertiary"
format = "[[ $symbol( $version) ](fg:on_tertiary bg:tertiary)]($style)"

[python]
symbol = ""
style = "bg:tertiary"
format = "[[ $symbol( $version) ](fg:on_tertiary bg:tertiary)]($style)"

[docker_context]
symbol = ""
style = "bg:surface2"
format = "[[ $symbol( $context) ](fg:text bg:surface2)]($style)"

[conda]
style = "bg:surface2"
format = "[[ $symbol( $environment) ](fg:text bg:surface2)]($style)"

[pixi]
style = "bg:surface2"
format = "[[ $symbol( $version)( $environment) ](fg:text bg:surface2)]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:surface2"
format = "[[  $time ](fg:text bg:surface2)]($style)"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[](bold fg:green)"
error_symbol = "[](bold fg:red)"
vimcmd_symbol = "[](bold fg:green)"
vimcmd_replace_one_symbol = "[](bold fg:mauve)"
vimcmd_replace_symbol = "[](bold fg:mauve)"
vimcmd_visual_symbol = "[](bold fg:yellow)"

# >>> NOCTALIA STARSHIP PALETTE >>>
# Deterministic Catppuccin Frappe fallback. Noctalia owns this marked block.
[palettes.noctalia]
primary = "#8caaee"
on_primary = "#303446"
secondary = "#e5c890"
on_secondary = "#303446"
accent = "#81c8be"
on_accent = "#303446"
tertiary = "#ca9ee6"
on_tertiary = "#303446"
surface2 = "#626880"
text = "#c6d0f5"
green = "#a6d189"
yellow = "#e5c890"
red = "#e78284"
mauve = "#ca9ee6"
# <<< NOCTALIA STARSHIP PALETTE <<<
